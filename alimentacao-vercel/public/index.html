<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delegacia de Polícia de Sinop — Controle de Alimentação</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  .badge-almoco { background:#fef3c7; color:#92400e; }
  .badge-jantar { background:#e0e7ff; color:#3730a3; }
  table { border-collapse: collapse; width:100%; }
  th, td { padding:8px 10px; border-bottom:1px solid #e5e7eb; font-size:13px; text-align:left; white-space:nowrap; }
  th { background:#f8fafc; font-weight:600; color:#475569; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div id="app"></div>

<script>
// ============================================================
// ESTADO GLOBAL
// ============================================================
const state = {
  user: JSON.parse(localStorage.getItem('sessionUser') || 'null'),
  route: location.hash || '#/login',
  records: [],
  users: [],
  deleted: [],
  page: 1,
  pageSize: 20,
};

const $app = document.getElementById('app');

function saveSession(user) {
  state.user = user;
  localStorage.setItem('sessionUser', JSON.stringify(user));
}
function logout() {
  state.user = null;
  localStorage.removeItem('sessionUser');
  navigate('#/login');
}
function navigate(route) {
  location.hash = route;
}
window.addEventListener('hashchange', () => { state.route = location.hash; render(); });

// ============================================================
// API HELPERS
// ============================================================
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({ ok: false, message: 'Resposta inválida do servidor' }));
  if (!res.ok || data.ok === false) throw new Error(data.message || 'Erro na requisição');
  return data;
}

// ============================================================
// FORMATAÇÃO
// ============================================================
const fmtMoney = (v) => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
const fmtDate = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
};
const fmtDateTime = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString('pt-BR');
};

// ============================================================
// TELA: LOGIN DO SISTEMA
// ============================================================
function renderLogin() {
  $app.innerHTML = `
  <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-[#0b1a3a] to-[#12265c] px-4">
    <div class="w-16 h-16 rounded-2xl bg-blue-800/60 border border-blue-400/40 flex items-center justify-center mb-4">🛡️</div>
    <h1 class="text-white text-2xl font-bold">Delegacia de Polícia de Sinop</h1>
    <p class="text-blue-200 mb-6 text-sm">Sistema de Controle de Alimentação para Custodiados</p>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
      <h2 class="text-lg font-semibold mb-1">Acesso ao Sistema</h2>
      <p class="text-sm text-slate-500 mb-4">Informe seu nome completo e matrícula/senha para acessar.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-sm font-medium">Nome Completo</label>
          <input name="nome" required class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="Digite seu nome completo" />
        </div>
        <div>
          <label class="text-sm font-medium">Número de Matrícula/ou Senha</label>
          <input name="credencial" required type="password" class="mt-1 w-full border rounded-lg px-3 py-2" placeholder="Digite sua matrícula ou senha" />
        </div>
        <p id="loginError" class="text-red-600 text-sm hidden"></p>
        <button class="w-full bg-blue-700 hover:bg-blue-800 text-white rounded-lg py-2.5 font-medium">Acessar Sistema</button>
      </form>

      <div class="text-center mt-4">
        <a href="#/cadastrar-senha" class="text-sm text-blue-700 hover:underline">Cadastre uma Senha</a>
      </div>
    </div>

    <p class="text-blue-200 text-xs mt-6">Acesso restrito a servidores autorizados · ${new Date().getFullYear()}</p>
    <button onclick="navigate('#/admin-login')" class="mt-3 text-xs text-blue-300 border border-blue-400/40 rounded-full px-4 py-1.5 hover:bg-blue-800/40">
      🛡️ Acesso Administrativo
    </button>
  </div>`;

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');
    try {
      const { user } = await api('/api/login', {
        method: 'POST',
        body: { nome: form.get('nome'), credencial: form.get('credencial') },
      });
      saveSession(user);
      navigate('#/dashboard');
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });
}

// ============================================================
// TELA: LOGIN ADMINISTRATIVO
// ============================================================
function renderAdminLogin() {
  $app.innerHTML = `
  <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-[#0b1a3a] to-[#12265c] px-4">
    <div class="bg-[#16204a] border border-blue-500/30 rounded-2xl shadow-xl w-full max-w-md p-8 text-white">
      <div class="flex justify-center mb-3">
        <div class="w-14 h-14 rounded-xl bg-blue-700 flex items-center justify-center text-2xl">🔒</div>
      </div>
      <h2 class="text-xl font-bold text-center">Painel Administrativo</h2>
      <p class="text-blue-200 text-center text-sm mb-6">Sistema de Controle de Alimentação</p>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="text-sm">Nome do Administrador</label>
          <input name="nome" required class="mt-1 w-full bg-[#0f1a3d] border border-blue-500/30 rounded-lg px-3 py-2" placeholder="Digite seu nome completo" />
        </div>
        <div>
          <label class="text-sm">Senha de Acesso</label>
          <input name="senha" type="password" required class="mt-1 w-full bg-[#0f1a3d] border border-blue-500/30 rounded-lg px-3 py-2" placeholder="Digite sua senha" />
        </div>
        <p id="adminLoginError" class="text-red-400 text-sm hidden"></p>
        <button class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg py-2.5 font-medium">🛡️ Acessar Painel</button>
      </form>

      <button onclick="navigate('#/login')" class="mt-6 text-sm text-blue-300 hover:underline block text-center w-full">← Voltar ao sistema</button>
    </div>
  </div>`;

  document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData(e.target);
    const errEl = document.getElementById('adminLoginError');
    errEl.classList.add('hidden');
    try {
      const { user } = await api('/api/admin-login', {
        method: 'POST',
        body: { nome: form.get('nome'), senha: form.get('senha') },
      });
      saveSession(user);
      navigate('#/admin');
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');

// ============================================================
// LAYOUT COMUM (SIDEBAR)
// ============================================================
function layout(activeKey, contentHtml) {
  const isAdmin = state.user && state.user.isAdmin;
  const menuItem = (key, label, icon) => `
    <button onclick="navigate('${key}')" class="w-full text-left px-3 py-2 rounded-lg text-sm flex items-center gap-2 ${activeKey === key ? 'bg-blue-800 text-white' : 'text-blue-100 hover:bg-blue-800/50'}">
      <span>${icon}</span><span>${label}</span>
    </button>`;

  return `
  <div class="min-h-screen flex">
    <aside class="w-60 bg-[#0d1a3f] text-white flex flex-col p-4 shrink-0">
      <div class="mb-6">
        <div class="font-bold flex items-center gap-2">🛡️ Delegacia de Polícia</div>
        <div class="text-xs text-blue-300">Sinop — MT</div>
      </div>
      <nav class="space-y-1 flex-1">
        ${menuItem('#/dashboard', 'Dashboard', '📊')}
        ${menuItem('#/relatorio', 'Relatório PDF', '📄')}
        ${menuItem('#/deletados', 'Registros Deletados', '🗑️')}
        ${isAdmin ? menuItem('#/admin', 'Painel Administrativo', '⚙️') : ''}
      </nav>
      <div class="border-t border-blue-800 pt-3 mt-3">
        <div class="text-sm font-medium truncate">${state.user ? state.user.nome : ''}</div>
        <div class="text-xs text-blue-300 mb-2">Servidor</div>
        <button onclick="logout()" class="text-sm text-red-300 hover:underline">Sair do Sistema</button>
      </div>
    </aside>
    <main class="flex-1 p-6 overflow-x-auto">${contentHtml}</main>
  </div>`;
}

function requireAuth() {
  if (!state.user) { navigate('#/login'); return false; }
  return true;
}
function requireAdmin() {
  if (!state.user || !state.user.isAdmin) { navigate('#/dashboard'); return false; }
  return true;
}

// ============================================================
// DASHBOARD
// ============================================================
async function renderDashboard() {
  if (!requireAuth()) return;
  $app.innerHTML = layout('#/dashboard', `<div id="dashContent" class="text-slate-500">Carregando registros...</div>`);
  try {
    const { records } = await api('/api/records');
    state.records = records;
    state.page = 1;
    paintDashboard();
  } catch (err) {
    document.getElementById('dashContent').innerHTML = `<p class="text-red-600">Erro ao carregar registros: ${err.message}</p>`;
  }
}

function computeStats(records) {
  const now = new Date();
  const mesAtual = records.filter((r) => {
    const d = new Date(r.dataCompra);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const almocosMes = mesAtual.filter((r) => r.tipo === 'Almoço').length;
  const jantasMes = mesAtual.filter((r) => r.tipo === 'Jantar').length;
  const gastoMes = mesAtual.reduce((acc, r) => acc + Number(r.valor || 0), 0);
  const custodiadosMes = new Set(mesAtual.map((r) => r.custodiado.toUpperCase())).size;

  const porCadastrador = {};
  records.forEach((r) => { porCadastrador[r.inseridoPor] = (porCadastrador[r.inseridoPor] || 0) + 1; });
  const topCadastradores = Object.entries(porCadastrador).sort((a, b) => b[1] - a[1]).slice(0, 5);

  const porDia = {};
  records.forEach((r) => { const d = fmtDate(r.dataCompra); porDia[d] = (porDia[d] || 0) + 1; });
  const topDias = Object.entries(porDia).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return { almocosMes, jantasMes, gastoMes, custodiadosMes, topCadastradores, topDias };
}

function applyFilters(records) {
  const get = (id) => document.getElementById(id)?.value?.trim().toLowerCase() || '';
  const dataInicio = get('fDataInicio');
  const dataFim = get('fDataFim');
  const tipo = get('fTipo');
  const responsavel = get('fResponsavel');
  const custodiado = get('fCustodiado');
  const nBo = get('fNBo');
  const estabelecimento = get('fEstabelecimento');
  const valorMin = parseFloat(get('fValorMin') || '0');
  const valorMax = parseFloat(get('fValorMax') || '999999');

  return records.filter((r) => {
    if (dataInicio && r.dataCompra < dataInicio) return false;
    if (dataFim && r.dataCompra > dataFim) return false;
    if (tipo && tipo !== 'todos' && r.tipo.toLowerCase() !== tipo) return false;
    if (responsavel && !r.responsavel.toLowerCase().includes(responsavel)) return false;
    if (custodiado && !r.custodiado.toLowerCase().includes(custodiado)) return false;
    if (nBo && !(r.nBo || '').toLowerCase().includes(nBo)) return false;
    if (estabelecimento && !r.estabelecimento.toLowerCase().includes(estabelecimento)) return false;
    if (!isNaN(valorMin) && Number(r.valor) < valorMin) return false;
    if (!isNaN(valorMax) && Number(r.valor) > valorMax) return false;
    return true;
  }).sort((a, b) => new Date(b.dataCompra) - new Date(a.dataCompra));
}

function getFiltered() {
  return applyFilters(state.records);
}

function paintDashboard() {
  const stats = computeStats(state.records);
  const filtered = getFiltered();
  const totalGasto = filtered.reduce((acc, r) => acc + Number(r.valor || 0), 0);
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const pageItems = filtered.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);

  document.getElementById('dashContent').innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold">Dashboard</h1>
        <p class="text-slate-500 text-sm">Controle de Fornecimento de Alimentação para Custodiados</p>
      </div>
      <button onclick="openRecordModal()" class="bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2 text-sm font-medium">+ Novo Registro</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      ${statCard('Almoços no Mês', stats.almocosMes, 'refeições', '☀️')}
      ${statCard('Jantas no Mês', stats.jantasMes, 'refeições', '🌙')}
      ${statCard('Gasto no Mês', fmtMoney(stats.gastoMes), 'total investido', '💲')}
      ${statCard('Custodiados Atendidos', stats.custodiadosMes, 'no mês', '👥')}
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="bg-white rounded-xl p-4 shadow-sm">
        <h3 class="font-semibold mb-3 text-sm">📊 Top 5 Cadastradores</h3>
        ${stats.topCadastradores.map(([nome, count], i) => rankBar(i + 1, nome, count, Math.max(...stats.topCadastradores.map(c=>c[1])))).join('') || '<p class="text-sm text-slate-400">Sem dados</p>'}
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm">
        <h3 class="font-semibold mb-3 text-sm">📅 Top 5 Dias com Mais Pedidos</h3>
        ${stats.topDias.map(([dia, count], i) => rankBar(i + 1, dia, count, Math.max(...stats.topDias.map(c=>c[1])), true)).join('') || '<p class="text-sm text-slate-400">Sem dados</p>'}
      </div>
    </div>

    <div class="bg-white rounded-xl p-4 shadow-sm mb-6">
      <h3 class="font-semibold mb-3 text-sm">🔍 Filtros</h3>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
        <div><label class="text-xs text-slate-500">Data Início</label><input id="fDataInicio" type="date" class="w-full border rounded px-2 py-1.5"/></div>
        <div><label class="text-xs text-slate-500">Data Fim</label><input id="fDataFim" type="date" class="w-full border rounded px-2 py-1.5"/></div>
        <div><label class="text-xs text-slate-500">Tipo de Refeição</label>
          <select id="fTipo" class="w-full border rounded px-2 py-1.5">
            <option value="todos">Todos</option><option value="almoço">Almoço</option><option value="jantar">Jantar</option>
          </select>
        </div>
        <div><label class="text-xs text-slate-500">Responsável</label><input id="fResponsavel" class="w-full border rounded px-2 py-1.5" placeholder="Nome"/></div>
        <div><label class="text-xs text-slate-500">Custodiado(a)</label><input id="fCustodiado" class="w-full border rounded px-2 py-1.5" placeholder="Nome"/></div>
        <div><label class="text-xs text-slate-500">Nº BO</label><input id="fNBo" class="w-full border rounded px-2 py-1.5" placeholder="Número do BO"/></div>
        <div><label class="text-xs text-slate-500">Estabelecimento</label><input id="fEstabelecimento" class="w-full border rounded px-2 py-1.5"/></div>
        <div class="flex gap-2">
          <div class="flex-1"><label class="text-xs text-slate-500">Valor Mín.</label><input id="fValorMin" type="number" step="0.01" class="w-full border rounded px-2 py-1.5" value="0"/></div>
          <div class="flex-1"><label class="text-xs text-slate-500">Valor Máx.</label><input id="fValorMax" type="number" step="0.01" class="w-full border rounded px-2 py-1.5" value="999.99"/></div>
        </div>
      </div>
      <div class="mt-3 flex justify-end gap-2">
        <button onclick="state.page=1; paintDashboard()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm rounded px-4 py-1.5">Aplicar Filtros</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm">
      <div class="flex justify-between items-center p-4 border-b">
        <h3 class="font-semibold text-sm">🍽️ Registros de Alimentação — ${filtered.length} registros</h3>
        <span class="text-sm bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Total: ${fmtMoney(totalGasto)}</span>
      </div>
      <div class="overflow-x-auto">
        <table>
          <thead><tr>
            <th></th><th>Tipo</th><th>Data</th><th>Custodiado(a)</th><th>Nº BO</th><th>Estabelecimento</th>
            <th>Entrada</th><th>Saída</th><th>Responsável</th><th>Valor</th><th>Ações</th>
          </tr></thead>
          <tbody>
            ${pageItems.map(recordRow).join('') || `<tr><td colspan="11" class="text-center text-slate-400 py-6">Nenhum registro encontrado</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="flex justify-between items-center p-4 text-sm text-slate-500">
        <span>Página ${state.page} de ${totalPages} · ${filtered.length} registros</span>
        <div class="flex gap-2">
          <button onclick="changePage(-1)" class="border rounded px-3 py-1 hover:bg-slate-50">‹</button>
          <button onclick="changePage(1)" class="border rounded px-3 py-1 hover:bg-slate-50">›</button>
        </div>
      </div>
    </div>

    <div id="modalRoot"></div>
  `;
}

function statCard(title, value, sub, icon) {
  return `<div class="bg-white rounded-xl p-4 shadow-sm">
    <div class="flex justify-between items-start">
      <div>
        <div class="text-xs text-slate-500">${title}</div>
        <div class="text-2xl font-bold mt-1">${value}</div>
        <div class="text-xs text-slate-400">${sub}</div>
      </div>
      <div class="text-xl">${icon}</div>
    </div>
  </div>`;
}
function rankBar(rank, label, value, max, isDate=false) {
  const pct = max ? Math.round((value / max) * 100) : 0;
  return `<div class="mb-2">
    <div class="flex justify-between text-xs mb-1"><span class="truncate pr-2">${rank}. ${label}</span><span class="font-medium">${value}${isDate ? ' pedidos' : ''}</span></div>
    <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-blue-500" style="width:${pct}%"></div></div>
  </div>`;
}
function recordRow(r) {
  const badgeClass = r.tipo === 'Almoço' ? 'badge-almoco' : 'badge-jantar';
  const auditTitle = `Inserido por: ${r.inseridoPor}\nData/hora inserção: ${fmtDateTime(r.dataInsercao)}${r.alteradoPor ? `\nAlterado por: ${r.alteradoPor}\nData/hora alteração: ${fmtDateTime(r.dataAlteracao)}` : ''}`;
  return `<tr>
    <td><span title="${auditTitle}" class="cursor-help text-slate-400">ⓘ</span></td>
    <td><span class="text-xs px-2 py-0.5 rounded-full ${badgeClass}">${r.tipo}</span></td>
    <td>${fmtDate(r.dataCompra)}</td>
    <td>${r.custodiado}</td>
    <td>${r.nBo || '—'}</td>
    <td>${r.estabelecimento}</td>
    <td>${r.dataEntrada ? fmtDate(r.dataEntrada) + ' ' + (r.horaEntrada || '') : '—'}</td>
    <td>${r.dataSaida ? fmtDate(r.dataSaida) + ' ' + (r.horaSaida || '') : '—'}</td>
    <td>${r.responsavel}</td>
    <td class="font-medium">${fmtMoney(r.valor)}</td>
    <td>
      <button onclick='openRecordModal(${JSON.stringify(r).replace(/'/g, "&apos;")})' class="text-blue-600 hover:underline text-xs mr-2">✏️</button>
      <button onclick="deleteRecord('${r.id}')" class="text-red-600 hover:underline text-xs">🗑️</button>
    </td>
  </tr>`;
}
function changePage(delta) {
  state.page += delta;
  if (state.page < 1) state.page = 1;
  paintDashboard();
}

// ---- Modal Novo/Editar Registro ----
function openRecordModal(record) {
  const isEdit = !!record;
  document.getElementById('modalRoot').innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold text-lg">${isEdit ? 'Editar' : 'Novo'} Registro de Alimentação</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">✕</button>
      </div>
      <form id="recordForm" class="grid grid-cols-2 gap-3 text-sm">
        <div class="col-span-1">
          <label class="text-xs font-medium">Tipo de Refeição *</label>
          <select name="tipo" required class="w-full border rounded px-2 py-1.5 mt-1">
            <option value="">Selecione...</option>
            <option value="Almoço" ${record?.tipo==='Almoço'?'selected':''}>Almoço</option>
            <option value="Jantar" ${record?.tipo==='Jantar'?'selected':''}>Jantar</option>
          </select>
        </div>
        <div><label class="text-xs font-medium">Valor (R$) *</label><input name="valor" type="number" step="0.01" required value="${record?.valor ?? '22.00'}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-medium">Data da Compra *</label><input name="dataCompra" type="date" required value="${record?.dataCompra ?? new Date().toISOString().slice(0,10)}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-medium">Estabelecimento *</label><input name="estabelecimento" required value="${record?.estabelecimento ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-medium">Nome do(a) Custodiado(a) *</label><input name="custodiado" required value="${record?.custodiado ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-medium">Nº do BO</label><input name="nBo" value="${record?.nBo ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div><label class="text-xs font-medium">Data de Entrada</label><input name="dataEntrada" type="date" value="${record?.dataEntrada ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div><label class="text-xs font-medium">Hora de Entrada</label><input name="horaEntrada" type="time" value="${record?.horaEntrada ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div><label class="text-xs font-medium">Data de Saída</label><input name="dataSaida" type="date" value="${record?.dataSaida ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div><label class="text-xs font-medium">Hora de Saída</label><input name="horaSaida" type="time" value="${record?.horaSaida ?? ''}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <div class="col-span-2"><label class="text-xs font-medium">Responsável pela Compra *</label><input name="responsavel" required value="${record?.responsavel ?? state.user.nome}" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <p id="recordError" class="col-span-2 text-red-600 text-xs hidden"></p>
        <div class="col-span-2 flex justify-end gap-2 mt-2">
          <button type="button" onclick="closeModal()" class="border rounded px-4 py-2 text-sm">Cancelar</button>
          <button class="bg-blue-700 hover:bg-blue-800 text-white rounded px-4 py-2 text-sm">${isEdit ? 'Salvar Alterações' : 'Adicionar Registro'}</button>
        </div>
      </form>
    </div>
  </div>`;

  document.getElementById('recordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = Object.fromEntries(new FormData(e.target).entries());
    const errEl = document.getElementById('recordError');
    errEl.classList.add('hidden');
    try {
      if (isEdit) {
        await api('/api/records', { method: 'PUT', body: { id: record.id, ...form, alteradoPor: state.user.nome } });
      } else {
        await api('/api/records', { method: 'POST', body: form });
      }
      closeModal();
      renderDashboard();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

async function deleteRecord(id) {
  if (!confirm('Tem certeza que deseja excluir este registro?')) return;
  try {
    await api('/api/records', { method: 'DELETE', body: { id, excluidoPor: state.user.nome } });
    renderDashboard();
  } catch (err) {
    alert('Erro ao excluir: ' + err.message);
  }
}

// ============================================================
// RELATÓRIO PDF
// ============================================================
function renderRelatorio() {
  if (!requireAuth()) return;
  const hoje = new Date().toISOString().slice(0, 10);
  $app.innerHTML = layout('#/relatorio', `
    <h1 class="text-2xl font-bold mb-1">📄 Relatório de Alimentação</h1>
    <p class="text-slate-500 text-sm mb-6">Gere e faça download do relatório em PDF (A4 horizontal)</p>

    <div class="bg-white rounded-xl p-4 shadow-sm mb-6 grid grid-cols-2 gap-4">
      <div><label class="text-xs text-slate-500">Data Início</label><input id="rDataInicio" type="date" class="w-full border rounded px-2 py-1.5"/></div>
      <div><label class="text-xs text-slate-500">Data Fim</label><input id="rDataFim" type="date" value="${hoje}" class="w-full border rounded px-2 py-1.5"/></div>
    </div>

    <button onclick="gerarRelatorioPDF()" class="bg-blue-700 hover:bg-blue-800 text-white rounded-lg px-4 py-2 text-sm font-medium">⬇ Baixar Relatório em PDF</button>
  `);
}

async function gerarRelatorioPDF() {
  const { records } = await api('/api/records');
  const dataInicio = document.getElementById('rDataInicio').value;
  const dataFim = document.getElementById('rDataFim').value;

  const filtrados = records.filter((r) => {
    if (dataInicio && r.dataCompra < dataInicio) return false;
    if (dataFim && r.dataCompra > dataFim) return false;
    return true;
  }).sort((a,b) => new Date(a.dataCompra) - new Date(b.dataCompra));

  const totalGasto = filtrados.reduce((acc, r) => acc + Number(r.valor || 0), 0);
  const almocos = filtrados.filter(r => r.tipo === 'Almoço').length;
  const jantas = filtrados.filter(r => r.tipo === 'Jantar').length;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  doc.setFontSize(14);
  doc.text('DELEGACIA DE POLÍCIA DE SINOP', 14, 14);
  doc.setFontSize(10);
  doc.text('Sistema de Controle de Fornecimento de Alimentação para Custodiados', 14, 20);
  doc.text(`Período: ${dataInicio || 'todos'} a ${dataFim || 'todos'}  |  Registros: ${filtrados.length}  |  Almoços: ${almocos}  |  Jantas: ${jantas}  |  Total: ${fmtMoney(totalGasto)}`, 14, 26);
  doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')} | Por: ${state.user.nome}`, 14, 31);

  doc.autoTable({
    startY: 36,
    head: [['Tipo','Data','Custodiado(a)','Nº BO','Estabelecimento','Entrada','Saída','Responsável','Valor']],
    body: filtrados.map(r => [
      r.tipo, fmtDate(r.dataCompra), r.custodiado, r.nBo || '—', r.estabelecimento,
      r.dataEntrada ? `${fmtDate(r.dataEntrada)} ${r.horaEntrada||''}` : '—',
      r.dataSaida ? `${fmtDate(r.dataSaida)} ${r.horaSaida||''}` : '—',
      r.responsavel, fmtMoney(r.valor)
    ]),
    styles: { fontSize: 7 },
    headStyles: { fillColor: [13, 26, 63] },
  });

  doc.save(`relatorio-alimentacao-${dataInicio || 'inicio'}-a-${dataFim || 'fim'}.pdf`);
}

      <h1 class="text-2xl font-bold mb-1">🗑️ Registros Deletados</h1>
      <p class="text-slate-500 text-sm mb-6">Histórico de registros excluídos com dados de auditoria completos — ${deleted.length} registros excluídos</p>
      <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <table>
          <thead><tr>
            <th>Tipo</th><th>Data Compra</th><th>Custodiado(a)</th><th>Nº BO</th><th>Estabelecimento</th>
            <th>Valor</th><th>Inserido por</th><th>Data Inserção</th><th>Excluído por</th><th>Data Exclusão</th>
          </tr></thead>
          <tbody>
            ${deleted.map(d => `<tr>
              <td>${d.tipo}</td><td>${fmtDate(d.dataCompra)}</td><td>${d.custodiado}</td><td>${d.nBo||'—'}</td>

// PAINEL ADMINISTRATIVO

async function renderAdmin() {
  if (!requireAdmin()) return;
  $app.innerHTML = layout('#/admin', `<div id="adminContent">Carregando usuários...</div>`);
  try {
    const { users } = await api('/api/users');
    state.users = users;
    paintAdmin();
  } catch (err) {
    document.getElementById('adminContent').innerHTML = `<p class="text-red-600">Erro: ${err.message}</p>`;
  }
}

function paintAdmin() {
  const users = state.users;
  document.getElementById('adminContent').innerHTML = `
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold">Painel Administrativo</h1>
        <p class="text-slate-500 text-sm">Gestão de Usuários</p>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-6">
      ${statCard('Usuários cadastrados', users.length, '', '👥')}
      ${statCard('Usuários ativos', users.filter(u=>u.ativo!==false).length, '', '🪪')}
      ${statCard('Administradores', users.filter(u=>u.isAdmin).length, '', '🛡️')}
    </div>

    <div class="bg-white rounded-xl shadow-sm mb-6">
      <div class="flex justify-between items-center p-4 border-b">
        <h3 class="font-semibold text-sm">Usuários do Sistema</h3>
        <button onclick="openUserModal()" class="bg-blue-700 hover:bg-blue-800 text-white text-sm rounded px-3 py-1.5">+ Novo Usuário</button>
      </div>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>#</th><th>Nome Completo</th><th>Matrícula</th><th>Admin</th><th>Status</th><th>Cadastrado em</th><th>Ações</th></tr></thead>
          <tbody>
            ${users.map((u, i) => `<tr>
              <td>${i+1}</td><td>${u.nome}</td><td>${u.matricula}</td>
              <td>${u.isAdmin ? '✅' : '—'}</td>
              <td><span class="text-xs px-2 py-0.5 rounded-full ${u.ativo!==false ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-500'}">${u.ativo!==false ? 'Ativo' : 'Inativo'}</span></td>
              <td>${fmtDate(u.criadoEm)}</td>
              <td><button onclick="deleteUser('${u.id}')" class="text-red-600 hover:underline text-xs">🗑️ Excluir</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div id="userModalRoot"></div>
  `;
}

function openUserModal() {
  document.getElementById('userModalRoot').innerHTML = `
  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold text-lg">Cadastrar Novo Usuário</h3>
        <button onclick="document.getElementById('userModalRoot').innerHTML=''" class="text-slate-400 hover:text-slate-700">✕</button>
      </div>
      <form id="userForm" class="space-y-3 text-sm">
        <div><label class="text-xs font-medium">Nome Completo *</label><input name="nome" required class="w-full border rounded px-2 py-1.5 mt-1" placeholder="Ex: JOÃO DA SILVA SANTOS"/></div>
        <div><label class="text-xs font-medium">Número de Matrícula *</label><input name="matricula" required class="w-full border rounded px-2 py-1.5 mt-1" placeholder="Ex: 123456"/></div>
        <div><label class="text-xs font-medium">E-mail (opcional)</label><input name="email" type="email" class="w-full border rounded px-2 py-1.5 mt-1" placeholder="usuario@pjc.mt.gov.br"/></div>
        <div><label class="text-xs font-medium">Senha (opcional — obrigatória se marcar Administrador)</label><input name="senha" type="password" class="w-full border rounded px-2 py-1.5 mt-1"/></div>
        <label class="flex items-center gap-2 text-xs"><input type="checkbox" name="isAdmin"/> Este usuário é Administrador</label>
        <p id="userError" class="text-red-600 text-xs hidden"></p>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="document.getElementById('userModalRoot').innerHTML=''" class="border rounded px-4 py-2">Cancelar</button>
          <button class="bg-blue-700 hover:bg-blue-800 text-white rounded px-4 py-2">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>`;

  document.getElementById('userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = {
      nome: fd.get('nome'), matricula: fd.get('matricula'), email: fd.get('email'),
      senha: fd.get('senha'), isAdmin: fd.get('isAdmin') === 'on',
    };
    const errEl = document.getElementById('userError');
    errEl.classList.add('hidden');
    try {
      await api('/api/users', { method: 'POST', body });
      document.getElementById('userModalRoot').innerHTML = '';
      renderAdmin();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });
}

async function deleteUser(id) {
  if (!confirm('Excluir este usuário?')) return;
  try {
    await api('/api/users?id=' + encodeURIComponent(id), { method: 'DELETE' });
    renderAdmin();
  } catch (err) {
    alert('Erro: ' + err.message);
  }
}

// ============================================================
// ROTEADOR
// ============================================================
function render() {
  const route = state.route.split('?')[0];
  if (route === '#/admin-login') return renderAdminLogin();
  if (route === '#/admin') return renderAdmin();
  if (route === '#/dashboard') return renderDashboard();
  if (route === '#/relatorio') return renderRelatorio();
  if (route === '#/deletados') return renderDeletados();
  return renderLogin();
}

// Inicialização: se já tem sessão salva, pula direto pro dashboard
if (state.user && (state.route === '#/login' || !state.route)) {
  state.route = '#/dashboard';
  location.hash = '#/dashboard';
}
render();
</script>
